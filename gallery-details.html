<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>
    Gallery Details
  </title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {

      background: #111;
      color: #fff;

      font-family: Arial;

      padding: 30px;

    }

    /* =========================
       LOADER
    ========================== */

    #loader {

      position: fixed;

      top: 0;
      left: 0;

      width: 100%;
      height: 100vh;

      background: #111;

      display: flex;

      justify-content: center;
      align-items: center;

      z-index: 999999;

    }

    .spinner {

      width: 70px;
      height: 70px;

      border: 6px solid #333;

      border-top:
        6px solid #00ffcc;

      border-radius: 50%;
      animation:
        spin 1s linear infinite;

    }

    @keyframes spin {

      100% {

        transform: rotate(360deg);

      }

    }

    /* =========================
       TITLE
    ========================== */

    h1 {

      text-align: center;

      margin-bottom: 40px;

      font-size: 35px;

    }

    /* =========================
       GALLERY GRID
    ========================== */

    .gallery-grid {

      display: grid;

      grid-template-columns:
        repeat(auto-fit,
          minmax(300px, 1fr));

      gap: 20px;

    }

    .gallery-item {

      border-radius: 15px;

      overflow: hidden;

      cursor: pointer;

      transition: 0.3s;

      background: #000;

    }

    .gallery-item:hover {

      transform: translateY(-5px);

    }

    .gallery-item img,
    .gallery-item video {

      width: 100%;
      height: 300px;

      object-fit: cover;

      display: block;

    }

    /* =========================
       POPUP
    ========================== */

    .popup-overlay {

      position: fixed;

      top: 0;
      left: 0;

      width: 100%;
      height: 100vh;

      background:
        rgba(0, 0, 0, 0.96);

      z-index: 9999;

      display: none;

      justify-content: center;
      align-items: center;

    }

    .popup-content {

      width: 95%;
      height: 90vh;

      display: flex;

      gap: 20px;

    }

    /* LEFT BIG */

    .popup-main {

      width: 80%;
      height: 100%;

      background: #000;

      border-radius: 20px;

      overflow: hidden;

    }

    .popup-main img,
    .popup-main video {

      width: 100%;
      height: 100%;

      object-fit: contain;

    }

    /* RIGHT THUMBNAILS */

    .popup-thumbnails {

      width: 20%;

      overflow-y: auto;

      display: grid;

      grid-template-columns:
        1fr 1fr;

      gap: 10px;

      padding-right: 5px;

    }

    .popup-thumbnails::-webkit-scrollbar {

      width: 5px;

    }

    .popup-thumbnails::-webkit-scrollbar-thumb {

      background: #555;

      border-radius: 10px;

    }

    .popup-thumb {

      height: 120px;

      border-radius: 12px;

      overflow: hidden;

      cursor: pointer;

      border: 2px solid transparent;

      transition: 0.3s;

    }

    .popup-thumb.active {

      border-color: #00ffcc;

    }

    .popup-thumb:hover {

      transform: scale(1.03);

    }

    .popup-thumb img,
    .popup-thumb video {

      width: 100%;
      height: 100%;

      object-fit: cover;

    }

    /* CLOSE BUTTON */

    .close-btn {

      position: absolute;

      top: 20px;
      right: 20px;

      width: 45px;
      height: 45px;

      border: none;

      border-radius: 50%;

      cursor: pointer;

      font-size: 20px;

      z-index: 100;

    }

    /* =========================
       MOBILE
    ========================== */

    @media(max-width:900px) {

      body {

        padding: 15px;

      }

      .popup-content {

        flex-direction: column;

      }

      .popup-main {

        width: 100%;
        height: 60vh;

      }

      .popup-thumbnails {

        width: 100%;

        grid-template-columns:
          repeat(3, 1fr);

      }

    }

    .popup-overlay {

      position: fixed;

      top: 0;
      left: 0;

      width: 100%;
      height: 100vh;

      background: rgba(0, 0, 0, 0.95);

      display: none;

      justify-content: center;
      align-items: center;

      z-index: 99999;

    }

    .popup-main {

      width: 90%;
      height: 90vh;

      display: flex;

      justify-content: center;
      align-items: center;

    }

    .popup-main img,
    .popup-main video {

      max-width: 100%;
      max-height: 100%;

      object-fit: contain;

      border-radius: 12px;

    }

    .close-btn {

      position: absolute;

      top: 20px;
      right: 20px;

      width: 45px;
      height: 45px;

      border: none;

      border-radius: 50%;

      cursor: pointer;

      font-size: 22px;

      z-index: 1000;

    }

    .nav-btn {

      position: absolute;

      top: 50%;

      transform: translateY(-50%);

      width: 55px;
      height: 55px;

      border: none;

      border-radius: 50%;

      font-size: 30px;

      cursor: pointer;

      z-index: 1000;

    }

    .left-btn {

      left: 20px;

    }

    .right-btn {

      right: 20px;

    }

    .top-bar {

      margin-bottom: 20px;

    }

    .back-btn {

      background: #222;

      color: #fff;

      border: none;

      padding: 12px 20px;

      border-radius: 10px;

      cursor: pointer;

      font-size: 16px;

      transition: 0.3s;

    }

    .back-btn:hover {

      background: #00ffcc;

      color: #000;

    }
  </style>

</head>

<body>

  <!-- =========================
       LOADER
  ========================== -->

  <div id="loader">

    <div class="spinner"></div>

  </div>

  <!-- =========================
       TITLE
  ========================== -->

  <h1 id="galleryTitle">
    Gallery
  </h1>
  <div class="top-bar">

    <button class="back-btn" onclick="goBack()">
      ← Back
    </button>

  </div>


  <div class="gallery-grid" id="galleryGrid"></div>



  <div class="popup-overlay" id="popupOverlay">

    <!-- CLOSE -->

    <button class="close-btn" id="closeBtn">
      ✕
    </button>

    <!-- LEFT -->

    <button class="nav-btn left-btn" id="prevBtn">
      ❮
    </button>

    <!-- MAIN -->

    <div class="popup-main" id="popupMain"></div>

    <!-- RIGHT -->

    <button class="nav-btn right-btn" id="nextBtn">
      ❯
    </button>

  </div>


  <!-- =========================
       SCRIPT
  ========================== -->

  <script>


    function goBack() {

      window.history.back();

    }

    let allMedia = [];

    async function loadGalleryDetails() {

      const params =
        new URLSearchParams(
          window.location.search
        );

      const id =
        params.get("id");

      try {

        const response =
          await fetch(
            "https://aliceblue-swan-648054.hostingersite.com/gallery/get-gallery"
          );

        const result =
          await response.json();

        const galleryData =
          result.data;

        const selectedGallery =
          galleryData.find(
            (item) => item._id === id
          );

        console.log(selectedGallery);

        // TITLE

        document.getElementById(
          "galleryTitle"
        ).innerText =
          selectedGallery.galleryName;

        // GRID

        const galleryGrid =
          document.getElementById(
            "galleryGrid"
          );

        galleryGrid.innerHTML =
          "";

        // STORE ALL MEDIA

        allMedia =
          selectedGallery.gallery;

        // LOOP

        selectedGallery.gallery.forEach(
          (media) => {

            const div =
              document.createElement(
                "div"
              );

            div.className =
              "gallery-item";

            // IMAGE

            if (media.image) {

              div.innerHTML = `
                <img
                  src="${media.image}"
                  alt=""
                />
              `;

            }

            // VIDEO

            else if (media.video) {

              div.innerHTML = `
                <video
                  src="${media.video}"
                  muted
                ></video>
              `;

            }

            // CLICK

            div.addEventListener(
              "click",
              () => {

                openPopup(
                  media
                );

              }
            );

            galleryGrid.appendChild(
              div
            );

          }
        );

        // =========================
        // HIDE LOADER
        // =========================

        document.getElementById(
          "loader"
        ).style.display =
          "none";

      }
      catch (error) {

        console.log(error);

        // HIDE LOADER IF ERROR

        document.getElementById(
          "loader"
        ).style.display =
          "none";

      }

    }

    /* =========================
       OPEN POPUP
    ========================== */

    function openPopup(
      selectedMedia
    ) {

      const popupOverlay =
        document.getElementById(
          "popupOverlay"
        );

      const popupThumbnails =
        document.getElementById(
          "popupThumbnails"
        );

      popupOverlay.style.display =
        "flex";

      popupThumbnails.innerHTML =
        "";

      // BIG IMAGE

      showPopupMedia(
        selectedMedia
      );

      // THUMBNAILS

      allMedia.forEach(
        (media) => {

          const thumb =
            document.createElement(
              "div"
            );

          thumb.className =
            "popup-thumb";

          if (
            media === selectedMedia
          ) {

            thumb.classList.add(
              "active"
            );

          }

          // IMAGE

          if (media.image) {

            thumb.innerHTML = `
              <img
                src="${media.image}"
              />
            `;

          }

          // VIDEO

          else if (media.video) {

            thumb.innerHTML = `
              <video
                src="${media.video}"
                muted
              ></video>
            `;

          }

          // CLICK

          thumb.addEventListener(
            "click",
            () => {

              document
                .querySelectorAll(
                  ".popup-thumb"
                )
                .forEach(
                  (item) => {
                    item.classList.remove(
                      "active"
                    );
                  }
                );

              thumb.classList.add(
                "active"
              );

              showPopupMedia(
                media
              );

            }
          );

          popupThumbnails.appendChild(
            thumb
          );

        }
      );

    }

    /* =========================
       SHOW BIG MEDIA
    ========================== */

    function showPopupMedia(
      media
    ) {

      const popupMain =
        document.getElementById(
          "popupMain"
        );

      // IMAGE

      if (media.image) {

        popupMain.innerHTML = `
          <img
            src="${media.image}"
          />
        `;

      }

      // VIDEO

      else if (media.video) {

        popupMain.innerHTML = `
          <video
            src="${media.video}"
            controls
            autoplay
          ></video>
        `;

      }

    }

    /* =========================
       CLOSE POPUP
    ========================== */

    document
      .getElementById(
        "closeBtn"
      )
      .addEventListener(
        "click",
        () => {

          document.getElementById(
            "popupOverlay"
          ).style.display =
            "none";

        }
      );

    /* =========================
       LOAD PAGE
    ========================== */

    loadGalleryDetails();


    let currentIndex = 0;

    /* =========================
       OPEN POPUP
    ========================== */

    function openPopup(selectedMedia) {

      currentIndex = allMedia.indexOf(selectedMedia);

      document.getElementById(
        "popupOverlay"
      ).style.display = "flex";

      showPopupMedia();

    }

    /* =========================
       SHOW MEDIA
    ========================== */

    function showPopupMedia() {

      const popupMain =
        document.getElementById(
          "popupMain"
        );

      const media =
        allMedia[currentIndex];

      // IMAGE

      if (media.image) {

        popupMain.innerHTML = `
      <img src="${media.image}" />
    `;

      }

      // VIDEO

      else if (media.video) {

        popupMain.innerHTML = `
      <video
        src="${media.video}"
        controls
        autoplay
      ></video>
    `;

      }

    }

    /* =========================
       NEXT
    ========================== */

    function nextMedia() {

      currentIndex++;

      if (
        currentIndex >= allMedia.length
      ) {

        currentIndex = 0;

      }

      showPopupMedia();

    }

    /* =========================
       PREV
    ========================== */

    function prevMedia() {

      currentIndex--;

      if (currentIndex < 0) {

        currentIndex =
          allMedia.length - 1;

      }

      showPopupMedia();

    }

    /* =========================
       BUTTON EVENTS
    ========================== */

    document
      .getElementById("nextBtn")
      .addEventListener(
        "click",
        nextMedia
      );

    document
      .getElementById("prevBtn")
      .addEventListener(
        "click",
        prevMedia
      );

    /* =========================
       CLOSE
    ========================== */

    document
      .getElementById("closeBtn")
      .addEventListener(
        "click",
        () => {

          document.getElementById(
            "popupOverlay"
          ).style.display = "none";

        }
      );

    /* =========================
       KEYBOARD SUPPORT
    ========================== */

    document.addEventListener(
      "keydown",
      (e) => {

        const popup =
          document.getElementById(
            "popupOverlay"
          );

        if (
          popup.style.display !== "flex"
        ) return;

        // RIGHT

        if (e.key === "ArrowRight") {

          nextMedia();

        }

        // LEFT

        if (e.key === "ArrowLeft") {

          prevMedia();

        }

        // ESC

        if (e.key === "Escape") {

          popup.style.display =
            "none";

        }

      }
    );


  </script>

</body>

</html>

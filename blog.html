    <div class="blog-container" id="blogContainer"></div>

    <script>

        async function getBlogs() {

            try {

                const response = await fetch(
                    "https://admin-panel-fawn-iota.vercel.app/bloge/get-blogs"
                );

                const result = await response.json();

                const container =
                    document.getElementById(
                        "blogContainer"
                    );

                result.data.forEach((blog) => {

                    if (!blog?.blag?.length) return;

                    container.innerHTML += `

<div
class="blog-card"
onclick="openBlog('${blog._id}')"
>

<img
src="${blog?.blag?.[0]?.image?.[0]?.photo
                        || ''
                        }"
alt=""
>

<div class="blog-card-content">

<h2>
${blog.heading}
</h2>

<p>
${new Date(
                            blog.createdAt
                        ).toLocaleDateString(
                            'en-GB'
                        )}
</p>

</div>

</div>

`;

                });

            }
            catch (error) {
                console.log(error);
            }

        }

        function openBlog(id) {

            window.location.href =
                'blog-detaile.html?id=' + id;

        }

        getBlogs();

    </script>

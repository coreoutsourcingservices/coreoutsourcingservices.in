<script>
    const blogId =
sessionStorage.getItem("blogId");

async function getBlogs(){

    try{

        const response =
        await fetch(
            "https://aliceblue-swan-648054.hostingersite.com/bloge/get-blogs"
        );

        const result =
        await response.json();

        const blog =
        result.data.find(
            item => item._id === blogId
        );

        if(!blog){

            document.getElementById(
                "blogDetails"
            ).innerHTML =
            "<h1>Blog Not Found</h1>";

            return;

        }

        document.getElementById(
            "blogDetails"
        ).innerHTML = `

<div class="blog-container">

<h1>
${blog.heading}
</h1>

<img
src="${
blog?.blag?.[0]?.image?.[0]?.photo || ''
}"
>

</div>

`;

    }
    catch(error){

        console.log(error);

    }

}

getBlogs();
</script>

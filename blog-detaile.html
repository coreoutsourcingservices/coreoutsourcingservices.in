<!DOCTYPE html>
<html lang="en">

<head>

    <title>CORE - BPO, Call Center & Digital Marketing</title>

    <meta charset="utf-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <meta name="format-detection"
        content="telephone=no">

    <link rel="icon"
        href="images/favicon.png"
        type="image/x-icon">

    <link rel="stylesheet"
        href="css/bootstrap.min.css">

    <link rel="stylesheet"
        href="css/animations.css">

    <link rel="stylesheet"
        href="css/font-awesome.css">

    <link rel="stylesheet"
        href="css/main.css">

    <script src="js/vendor/modernizr-2.6.2.min.js"></script>





    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            background:#212121;
            font-family:"Book Antiqua", serif;
        }

        .blog-close-btn{
            position:fixed;
            top:20px;
            right:20px;
            width:50px;
            height:50px;
            border:none;
            border-radius:50%;
            background:#111827;
            color:white;
            font-size:20px;
            cursor:pointer;
            z-index:599;
        }

        .blog-image-grid{
            width:100%;
            height:500px;
        }

        .blog-image-grid img{
            width:100%;
            height:100%;
            object-fit:cover;
        }

        .blog-container{
            max-width:900px;
            margin:auto;
            padding:40px 20px;
        }

        .blog-main-heading{
            font-size:52px;
            line-height:1.2;
            color:#f39900;
            margin-bottom:20px;
            font-weight:700;
        }

        .blog-writer{
            color:#babbbd;
            font-size:15px;
            margin-bottom:40px;
            padding-bottom:20px;
            border-bottom:1px solid #e5e7eb;
        }

        .blog-date{
            margin-top:10px;
            color:#b0b1b3;
        }

        .blog-intro{
            font-size:21px;
            margin-bottom:50px;
            color:#fcfdfe;
        }

        .blog-section{
            margin-bottom:10px;
        }

        .blog-section h2{
            font-size:32px;
            color:#f39900;
            margin-bottom:8px;
        }

        .blog-content-text{
            font-size:18px;
            margin-bottom:5px;
            color:#fbfbfc;
            white-space:pre-line;
        }

        .blog-faq-title{
            font-size:38px;
            margin-top:70px;
            margin-bottom:25px;
            color:#f39900;
        }

        .blog-faq-card{
            background:#212121;
            padding:20px;
            margin-bottom:15px;
            border-radius:8px;
        }

        .blog-faq-card h3{
            color:#f39900;
            margin-bottom:10px;
            font-size:20px;
        }

        .blog-faq-card p{
            line-height:1.8;
            color:#f7f8f9;
        }

        @media(max-width:768px){

            .blog-image-grid{
                height:250px;
            }

            .blog-main-heading{
                font-size:32px;
            }

            .blog-section h2{
                font-size:24px;
            }

            .blog-content-text{
                font-size:16px;
            }

            .blog-intro{
                font-size:18px;
            }

            .blog-faq-title{
                font-size:28px;
            }

        }

    </style>

</head>

<body>

    <div id="blogDetails"></div>





    <script>

        // =========================================
        // GET BLOG ID FROM URL
        // =========================================

        const urlParams =
            new URLSearchParams(window.location.search);

        const blogId =
            urlParams.get("id");





        // =========================================
        // GENERATE DYNAMIC SCHEMA
        // =========================================

        function generateBlogSchema(blog) {

            // ARTICLE BODY

            const articleBody =
                blog?.blag?.[0]?.description
                    ?.map(item =>
                        item.description_text || ""
                    )
                    .join(" ");




            // FAQ DATA

            const faqData =
                blog?.blag?.[0]?.FAQ
                    ?.filter(faq =>
                        faq.Question &&
                        faq.answering
                    )
                    .map(faq => ({

                        "@type": "Question",

                        "name": faq.Question,

                        "acceptedAnswer": {

                            "@type": "Answer",

                            "text": faq.answering

                        }

                    }));





            // BLOG SCHEMA

            const blogSchema = {

                "@context": "https://schema.org",

                "@type": "BlogPosting",

                "headline":
                    blog.heading,

                "description":
                    blog?.blag?.[0]?.description_imga || "",

                "image":
                    blog?.blag?.[0]?.image?.[0]?.photo || "",

                "author": {

                    "@type": "Organization",

                    "name":
                        blog?.blag?.[0]?.writer_name ||
                        "Core Outsourcing Services"

                },

                "publisher": {

                    "@type": "Organization",

                    "name":
                        "Core Outsourcing Services",

                    "logo": {

                        "@type": "ImageObject",

                        "url":
                            "https://coreoutsourcingservices.in/images/Logo1.png"

                    }

                },

                "datePublished":
                    blog.createdAt,

                "dateModified":
                    blog.updatedAt ||
                    blog.createdAt,

                "mainEntityOfPage": {

                    "@type": "WebPage",

                    "@id":
                        "https://coreoutsourcingservices.in/blog-details.html?id=" +
                        blog._id

                },

                "url":
                    "https://coreoutsourcingservices.in/blog-details.html?id=" +
                    blog._id,

                "articleBody":
                    articleBody

            };





            // FAQ SCHEMA

            const faqSchema =
                faqData?.length
                    ? {

                        "@context": "https://schema.org",

                        "@type": "FAQPage",

                        "mainEntity": faqData

                    }
                    : null;





            // REMOVE OLD SCHEMA

            document
                .querySelectorAll(
                    'script[type="application/ld+json"]'
                )
                .forEach(el => el.remove());





            // ADD BLOG SCHEMA

            const script1 =
                document.createElement("script");

            script1.type =
                "application/ld+json";

            script1.text =
                JSON.stringify(blogSchema);

            document.head.appendChild(script1);





            // ADD FAQ SCHEMA

            if (faqSchema) {

                const script2 =
                    document.createElement("script");

                script2.type =
                    "application/ld+json";

                script2.text =
                    JSON.stringify(faqSchema);

                document.head.appendChild(script2);

            }

        }






        // =========================================
        // GET BLOG DATA
        // =========================================

        async function getBlogs() {

            try {

                const response =
                    await fetch(
                        "https://aliceblue-swan-648054.hostingersite.com/bloge/get-blogs"
                    );

                const result =
                    await response.json();





                const blog =
                    result.data.find(
                        item => item._id === blogId
                    );





                if (!blog) {

                    document.getElementById(
                        "blogDetails"
                    ).innerHTML =
                        `
                        <h1
                        style="
                        text-align:center;
                        margin-top:100px;
                        color:white;
                        "
                        >
                        Blog Not Found
                        </h1>
                        `;

                    return;

                }





                // GENERATE SEO SCHEMA

                generateBlogSchema(blog);





                // FAQ CHECK

                const hasFAQ =
                    blog?.blag?.[0]?.FAQ?.some(
                        faq =>
                            faq.Question ||
                            faq.answering
                    );





                // DESCRIPTION HTML

                let descriptionHTML = "";

                blog?.blag?.[0]?.description?.forEach(
                    (item) => {

                        const text =
                            (item.description_text || "")
                                .replace(/•/g, "<br>• ")
                                .replace(/(\d+\.)/g, "<br>$1 ");





                        descriptionHTML += `

                        <div class="blog-section">

                            ${item.description_heading
                                ? `
                                <h2>
                                    ${item.description_heading}
                                </h2>
                                `
                                : ""
                            }

                            <div class="blog-content-text">

                                ${text}

                            </div>

                        </div>

                        `;

                    }
                );





                // FAQ HTML

                let faqHTML = "";

                blog?.blag?.[0]?.FAQ?.forEach(
                    (faq) => {

                        if (
                            !faq.Question &&
                            !faq.answering
                        ) {
                            return;
                        }

                        faqHTML += `

                        <div class="blog-faq-card">

                            <h3>
                                ${faq.Question}
                            </h3>

                            <p>
                                ${faq.answering}
                            </p>

                        </div>

                        `;

                    }
                );





                // MAIN HTML

                document.getElementById(
                    "blogDetails"
                ).innerHTML = `

                <button
                class="blog-close-btn"
                onclick="closeBlog()"
                >
                    ✕
                </button>





                <div class="blog-container">

                    <h1 class="blog-main-heading">

                        ${blog.heading}

                    </h1>





                    <div class="blog-image-grid">

                        <img
                        src="${blog?.blag?.[0]?.image?.[0]?.photo || ""}"
                        alt="${blog.heading}"
                        >

                    </div>





                    <div class="blog-writer">

                        <h4>

                            Written By :
                            ${blog?.blag?.[0]?.writer_name || "Admin"}

                        </h4>





                        <div class="blog-date">

                            <h5>

                                Published On :

                                ${new Date(
                                    blog.createdAt
                                ).toLocaleDateString(
                                    "en-GB",
                                    {
                                        day: "numeric",
                                        month: "long",
                                        year: "numeric"
                                    }
                                )}

                            </h5>

                        </div>

                    </div>





                    <div class="blog-intro">

                        ${blog?.blag?.[0]?.description_imga || ""}

                    </div>





                    ${descriptionHTML}





                    ${hasFAQ
                        ? `

                        <h4 class="blog-faq-title">

                            Frequently Asked Questions

                        </h4>

                        ${faqHTML}

                        `
                        : ""
                    }

                </div>

                `;

            }

            catch (error) {

                console.log(error);

                document.getElementById(
                    "blogDetails"
                ).innerHTML =
                    `
                    <h1
                    style="
                    text-align:center;
                    margin-top:100px;
                    color:white;
                    "
                    >
                    Error Loading Blog
                    </h1>
                    `;

            }

        }





        // =========================================
        // CLOSE BLOG
        // =========================================

        function closeBlog() {

            history.back();

        }





        // =========================================
        // LOAD BLOG
        // =========================================

        getBlogs();

    </script>

</body>

</html>

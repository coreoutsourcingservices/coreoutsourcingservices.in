<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Blog Details</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Book Antiqua", serif;
        }

        body {
            background: #212121;


        }

        /* Close Button */

        .blog-close-btn {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 50px;
            height: 50px;
            border: none;
            border-radius: 50%;
            background: #111827;
            color: white;
            font-size: 20px;
            cursor: pointer;
            z-index: 599;
        }

        /* Hero Image */

        .blog-image-grid {
            width: 100%;
            height: 500px;
            /* overflow: hidden; */
        }

        .blog-image-grid img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Main Content */

        .blog-container {
            max-width: 900px;
            margin: auto;
            padding: 40px 20px;
        }

        /* Title */

        .blog-main-heading {
            font-size: 52px;
            line-height: 1.2;
            color: #f39900;
            margin-bottom: 20px;
            font-weight: 700;
        }

        /* Author */

        .blog-writer {
            color: #babbbd;
            font-size: 15px;
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 1px solid #e5e7eb;
        }

        .blog-date {
            margin-top: 10px;
            color: #b0b1b3;
        }

        /* Intro */

        .blog-intro {
            font-size: 21px;
            /* line-height: 1.9; */
            margin-bottom: 50px;
            color: #fcfdfe;
        }

        /* Sections */

        .blog-section {
            margin-bottom: 10px;
        }

        .blog-section h2 {
            font-size: 32px;
            color: #f39900;
            margin-bottom: 8px;
            /* line-height: 1.4; */
        }

        .blog-content-text {
            font-size: 18px;
            /* line-height: 2; */
            margin-bottom: 5px;
            color: #fbfbfc;
            white-space: pre-line;
        }

        /* FAQ */

        .blog-faq-title {
            font-size: 38px;
            margin-top: 70px;
            margin-bottom: 25px;
            color: #f39900;
        }

        .blog-faq-card {
            background: #212121;
            /* border-left: 4px solid #2563eb; */
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 8px;
        }

        .blog-faq-card h4 {
            color: #f39900;
            margin-bottom: 10px;
            font-size: 18px;
        }

        .blog-faq-card p {
            line-height: 1.8;
            color: #f7f8f9;
        }

        /* Mobile */

        @media(max-width:768px) {

            .blog-image-grid {
                height: 250px;
            }

            .blog-main-heading {
                font-size: 32px;
            }

            .blog-section h2 {
                font-size: 24px;
            }

            .blog-content-text {
                font-size: 16px;
            }

            .blog-intro {
                font-size: 18px;
            }

            .blog-faq-title {
                font-size: 28px;
            }

        }
    </style>

</head>

<body>

    <div id="blogDetails"></div>

    <script>

        const params =
            new URLSearchParams(
                window.location.search
            );

        const blogId =
            params.get("id");

        async function getBlogs() {

            try {

                const response =
                    await fetch(
                        "https://admin-panel-fawn-iota.vercel.app/bloge/get-blogs"
                    );

                const result =
                    await response.json();

                const blog =
                    result.data.find(
                        (item) =>
                            item._id === blogId
                    );
                const hasFAQ =
                    blog?.blag?.[0]?.FAQ?.some(
                        faq => faq.Question || faq.answering
                    );

                if (!blog) {

                    document.getElementById(
                        "blogDetails"
                    ).innerHTML =
                        "<h1 style='text-align:center;margin-top:100px'>Blog Not Found</h1>";

                    return;

                }

                let descriptionHTML = "";

                blog?.blag?.[0]?.description?.forEach(
                    (item) => {

                        const text = (item.description_text || "")
                            .replace(/•/g, "<br>• ")
                            .replace(/(\d+\.)/g, "<br>$1 ");

                        descriptionHTML += `<div class="blog-section">

${item.description_heading
                                ?
                                `<h2>
${item.description_heading}
</h2>`
                                :
                                ""
                            }

<div class="blog-content-text">
${text}
</div>

</div>

`;

                    }
                );

                let faqHTML = "";

                blog?.blag?.[0]?.FAQ?.forEach(
                    (faq) => {

                        if (
                            !faq.Question &&
                            !faq.answering
                        ) {
                            return;
                        }

                        faqHTML += `

<div class="blog-faq-card">

<h4>
${faq.Question}
</h4>

<p>
${faq.answering}
</p>

</div>

`;

                    }
                );

                document.getElementById(
                    "blogDetails"
                ).innerHTML = `

<button
class="blog-close-btn"
onclick="history.back()"
>
✕
</button>



<div class="blog-container">

<h1 class="blog-main-heading">
${blog.heading}
</h1>
<div class="blog-image-grid">

<img
src="${blog?.blag?.[0]?.image?.[0]?.photo || ""
                    }"
alt="${blog.heading
                    }"
>

</div>

<div class="blog-writer">

Written By :
${blog?.blag?.[0]?.writer_name
                    ||
                    "Admin"
                    }

<div class="blog-date">

Published On :
${new Date(
                        blog.createdAt
                    ).toLocaleDateString(
                        "en-GB",
                        {
                            day: "numeric",
                            month: "long",
                            year: "numeric"
                        }
                    )}

</div>

</div>

<div class="blog-intro">

${blog?.blag?.[0]
                        ?.description_imga
                    ||
                    ""
                    }

</div>

${descriptionHTML}

${hasFAQ
                        ? `
<h2 class="blog-faq-title">
Frequently Asked Questions
</h2>

${faqHTML}
`
                        : ""
                    }

</div>

`;

            }
            catch (error) {

                console.log(error);

                document.getElementById(
                    "blogDetails"
                ).innerHTML =
                    "<h1>Error Loading Blog</h1>";

            }

        }

        getBlogs();

    </script>

</body>

</html>

    Gallery
  </h1>
  <div class="top-bar">

    <button class="back-btn" onclick="goBack()">
      ← Back
    </button>

  </div>


  <div class="gallery-grid" id="galleryGrid"></div>



  <div class="popup-overlay" id="popupOverlay">

    <!-- CLOSE -->

    <button class="close-btn" id="closeBtn">
      ✕
    </button>

    <!-- LEFT -->

    <button class="nav-btn left-btn" id="prevBtn">
      ❮
    </button>

    <!-- MAIN -->

    <div class="popup-main" id="popupMain"></div>

    <!-- RIGHT -->

    <button class="nav-btn right-btn" id="nextBtn">
      ❯
    </button>

  </div>


  <script>

function goBack() {

  history.back();

}

let allMedia = [];

let currentIndex = 0;

/* SESSION ID */

const galleryId =
sessionStorage.getItem(
  "galleryId"
);

async function loadGalleryDetails() {

  try {

    const response =
    await fetch(
      " https://pk.coreoutsourcingservices.in/gallery/get-gallery"
    );

    const result =
    await response.json();

    const galleryData =
    result.data;

    /* FIND GALLERY */

    const selectedGallery =
    galleryData.find(
      item =>
      item._id === galleryId
    );

    /* NOT FOUND */

    if(!selectedGallery){

      document.body.innerHTML = `

      <h1
      style="
      color:white;
      text-align:center;
      margin-top:100px;
      "
      >
      Gallery Not Found
      </h1>

      `;

      return;

    }

    /* TITLE */

    document.getElementById(
      "galleryTitle"
    ).innerText =
    selectedGallery.galleryName;

    /* GRID */

    const galleryGrid =
    document.getElementById(
      "galleryGrid"
    );

    galleryGrid.innerHTML = "";

    /* STORE ALL MEDIA */

    allMedia =
    selectedGallery.gallery;

    /* LOOP */

    selectedGallery.gallery.forEach(
      (media) => {

        const div =
        document.createElement(
          "div"
        );

        div.className =
        "gallery-item";

        /* IMAGE */

        if(media.image){

          div.innerHTML = `

          <img
          src="${media.image}"
          alt="media.image"
          />

          `;

        }

        /* VIDEO */

        else if(media.video){

          div.innerHTML = `

          <video
          src="${media.video}"
          muted
          ></video>

          `;

        }

        /* CLICK */

        div.addEventListener(
          "click",
          () => {

            openPopup(media);

          }
        );

        galleryGrid.appendChild(
          div
        );

      }
    );

    /* HIDE LOADER */

    document.getElementById(
      "loader"
    ).style.display =
    "none";

  }
  catch(error){

    console.log(error);

    document.getElementById(
      "loader"
    ).style.display =
    "none";

  }

}

/* OPEN POPUP */

function openPopup(
  selectedMedia
){

  currentIndex =
  allMedia.indexOf(
    selectedMedia
  );

  document.getElementById(
    "popupOverlay"
  ).style.display =
  "flex";

  showPopupMedia();

}

/* SHOW MEDIA */

function showPopupMedia(){

  const popupMain =
  document.getElementById(
    "popupMain"
  );

  const media =
  allMedia[currentIndex];

  /* IMAGE */

  if(media.image){

    popupMain.innerHTML = `

    <img
    src="${media.image}"
    />

    `;

  }

  /* VIDEO */

  else if(media.video){

    popupMain.innerHTML = `

    <video
    src="${media.video}"
    controls
    autoplay
    ></video>

    `;

  }

}

/* NEXT */

function nextMedia(){

  currentIndex++;

  if(
    currentIndex >=
    allMedia.length
  ){

    currentIndex = 0;

  }

  showPopupMedia();

}

/* PREV */

function prevMedia(){

  currentIndex--;

  if(currentIndex < 0){

    currentIndex =
    allMedia.length - 1;

  }

  showPopupMedia();

}

/* BUTTONS */

document
.getElementById(
  "nextBtn"
)
.addEventListener(
  "click",
  nextMedia
);

document
  .getElementById("closeBtn")
  .addEventListener("click", closePopup);

function closePopup() {

  const popup = document.getElementById("popupOverlay");

  const video = document.querySelector("#popupMain video");

  if (video) {
    video.pause();
    video.currentTime = 0;
    video.muted = true;
    video.removeAttribute("src");
    video.load();
  }

  document.getElementById("popupMain").innerHTML = "";

  popup.style.display = "none";

}

/* CLOSE */

document
.getElementById(
  "closeBtn"
)
.addEventListener(
  "click",
  () => {




    document.getElementById(
      "popupOverlay"
    ).style.display =
    "none";

  }
);

/* KEYBOARD */

document.addEventListener(
  "keydown",
  (e) => {

    const popup =
    document.getElementById(
      "popupOverlay"
    );

    if(
      popup.style.display !==
      "flex"
    ) return;

    /* RIGHT */

    if(
      e.key ===
      "ArrowRight"
    ){

      nextMedia();

    }

    /* LEFT */

    if(
      e.key ===
      "ArrowLeft"
    ){

      prevMedia();

    }

    /* ESC */

    if(
      e.key ===
      "Escape"
    ){

      popup.style.display =
      "none";

    }

  }
);

/* LOAD */

loadGalleryDetails();

</script>

/* =====================================
WRAPPER

.gallery-wrapper {

===================================== */

/* IMAGE */

  <script>

    async function getGallery() {

      try {

        const response = await fetch(
          "https://aliceblue-swan-648054.hostingersite.com/gallery/get-gallery"
        );

        const result =
          await response.json();

        console.log(result);

        const galleryData =
          result.data;

        const galleryWrapper =
          document.getElementById(
            "galleryWrapper"
          );

        galleryWrapper.innerHTML =
          "";

        galleryData.forEach(
          (item) => {

            // first media
            const firstMedia =
              item.gallery.find(
                (media) =>
                  media.image ||
                  media.video
              );

            // card
            const card =
              document.createElement(
                "div"
              );

            card.className =
              "gallery-card";

            // media
            let mediaHTML = "";

            if (
              firstMedia?.image
            ) {

              mediaHTML = `
                <img
                  src="${firstMedia.image}"
                  alt="gallery"
                />
              `;

            } else if (
              firstMedia?.video
            ) {

              mediaHTML = `
                <video
                  src="${firstMedia.video}"
                  autoplay
                  muted
                  loop
                  controls
                ></video>
              `;

            }

            // html
            card.innerHTML = `

              ${mediaHTML}

              <div class="gallery-card-info">

                <h3>
                  ${item.galleryName}
                </h3>

                <p>
                  Photos:
                  ${item.totalPhotos}
                </p>

                <p>
                  Videos:
                  ${item.totalVideos}
                </p>

              </div>

            `;

            // click
           card.addEventListener("click", () => {

  window.location.href =
    `gallery-details.html?id=${item._id}`;

});

            galleryWrapper.appendChild(
              card
            );
          }
        );

      } catch (error) {

        console.log(error);

      }
    }

    // =====================================
    // OPEN POPUP
    // =====================================

    function openGalleryPopup(
      gallery
    ) {

      const popup =
        document.getElementById(
          "galleryPopup"
        );

      const popupTitle =
        document.getElementById(
          "popupTitle"
        );

      const popupGalleryGrid =
        document.getElementById(
          "popupGalleryGrid"
        );

      popup.style.display =
        "flex";

      popupTitle.innerText =
        gallery.galleryName;

      popupGalleryGrid.innerHTML =
        "";

      gallery.gallery.forEach(
        (media) => {

          const card =
            document.createElement(
              "div"
            );

          card.className =
            "popup-gallery-card";

          if (media.image) {

            card.innerHTML = `
              <img
                src="${media.image}"
                alt=""
              />
            `;

          } else if (
            media.video
          ) {

            card.innerHTML = `
              <video
                src="${media.video}"
                autoplay
                muted
                loop
                controls
              ></video>
            `;

          }

          popupGalleryGrid.appendChild(
            card
          );
        }
      );
    }

    // =====================================
    // CLOSE POPUP
    // =====================================

    document
      .getElementById(
        "closePopupBtn"
      )
      .addEventListener(
        "click",
        () => {

          document.getElementById(
            "galleryPopup"
          ).style.display =
            "none";

        }
      );

    // =====================================
    // PAGE LOAD
    // =====================================

    getGallery();

  </script>
